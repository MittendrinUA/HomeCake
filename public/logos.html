<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нові Варіанти логотипів</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #151212;
            color: #F4EFEA;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            color: #D4AF37;
            margin-bottom: 10px;
        }
        p {
            color: #8C7A7A;
            margin-bottom: 40px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #1E1919;
            border: 1px solid #2A2323;
            border-radius: 20px;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.1);
            border-color: #D4AF37;
        }
        .card img {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 15px;
        }
        .card h2 {
            font-size: 1.2rem;
            margin: 0;
            color: #F4EFEA;
        }
    </style>
</head>
<body>
    <h1>Оновлені логотипи (Вліво вниз, насичені кольори)</h1>
    <p>Ось 4 нові преміальні варіанти.</p>

    <div class="gallery">
        <div class="card">
            <img src="/whisk_dl_1_1791107993183.jpg" alt="Варіант 1">
            <h2>Варіант 1</h2>
        </div>
        <div class="card">
            <img src="/whisk_dl_2_1791108002755.jpg" alt="Варіант 2">
            <h2>Варіант 2</h2>
        </div>
        <div class="card">
            <img src="/whisk_dl_3_1791108013042.jpg" alt="Варіант 3">
            <h2>Варіант 3</h2>
        </div>
        <div class="card">
            <img src="/whisk_dl_4_1791108023610.jpg" alt="Варіант 4">
            <h2>Варіант 4</h2>
        </div>
    </div>
</body>
</html>
