<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запит на видалення акаунту</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #151212;
            color: #F4EFEA;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1E1919;
            padding: 40px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #2A2323;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 16px;
            color: #D4AF37;
        }
        p {
            color: #8C7A7A;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8C7A7A;
            margin-bottom: 8px;
        }
        input[type="email"] {
            background-color: #151212;
            border: 1px solid #2A2323;
            color: #F4EFEA;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 24px;
            outline: none;
        }
        input[type="email"]:focus {
            border-color: #D4AF37;
        }
        button {
            background-color: #D4AF37;
            color: #151212;
            font-size: 16px;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.98);
        }
        .success-message {
            display: none;
            color: #5B7A5A;
            background-color: rgba(91, 122, 90, 0.1);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(91, 122, 90, 0.3);
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container" id="form-container">
    <h1>Видалення акаунту</h1>
    <p>Введіть адресу електронної пошти, пов'язану з вашим акаунтом. Ми опрацюємо запит і видалимо ваші дані протягом 7 днів.</p>
    
    <form id="deletion-form">
        <label for="email">Email адреса</label>
        <input type="email" id="email" name="email" required placeholder="your.email@example.com">
        
        <button type="submit">Надіслати запит</button>
    </form>
    
    <div class="success-message" id="success-msg">
        Ваш запит надіслано успішно. Ваш акаунт та дані будуть видалені найближчим часом.
    </div>
</div>

<script>
    document.getElementById('deletion-form').addEventListener('submit', function(e) {
        e.preventDefault();
        // Here you would typically send this to your backend or Firebase
        // For static purposes, we just show a success message
        document.getElementById('deletion-form').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
    });
</script>

</body>
</html>
