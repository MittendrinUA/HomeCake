<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cstyle%3E@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap'); text { font-family: 'Great Vibes', cursive; }%3C/style%3E%3Ctext x='50' y='75' font-size='80' fill='%23D4AF37' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#151212" />
    <title>Whisked</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
<style>body { background-color: #000000; margin: 0; }</style>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay" style="display:none; position:fixed; z-index:9999; top:0; left:0; width:100%; height:100%; background:black; color:red; padding:20px; overflow:auto; font-family:monospace; font-size:12px;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var overlay = document.getElementById('error-overlay');
        overlay.style.display = 'block';
        overlay.innerHTML += '<p>Error: ' + e.message + '<br>Line: ' + e.lineno + '<br>Source: ' + e.filename + '</p>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var overlay = document.getElementById('error-overlay');
        overlay.style.display = 'block';
        overlay.innerHTML += '<p>Unhandled Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</p>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
